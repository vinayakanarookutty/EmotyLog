{% extends "layout.html" %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center fade-in">
    
    <div class="tilt-card glass p-10 rounded-3xl w-full max-w-md relative overflow-hidden">
        
        <div class="absolute -top-20 -right-20 w-64 h-64 bg-cyan-600 rounded-full blur-[100px] opacity-30"></div>
        <div class="absolute -bottom-20 -left-20 w-64 h-64 bg-blue-600 rounded-full blur-[100px] opacity-30"></div>

        <div class="relative z-10 text-center">
            <h2 class="text-4xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">INITIATE</h2>
            <p class="text-gray-400 mb-8 text-xs tracking-[0.2em] uppercase">Create New Neural Link</p>

            <form method="POST" class="space-y-5 text-left">
                
                <div class="relative group">
                    <input type="text" name="username" required 
                        class="peer w-full bg-black/40 border border-white/10 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-cyan-400 transition-all placeholder-transparent"
                        placeholder="Username">
                    <label class="absolute left-4 top-3 text-gray-500 text-sm transition-all peer-placeholder-shown:text-base peer-placeholder-shown:top-3 peer-focus:-top-6 peer-focus:text-cyan-400 peer-focus:text-xs">
                        Define Username
                    </label>
                </div>

                <div class="relative group">
                    <input type="password" name="password" required 
                        class="peer w-full bg-black/40 border border-white/10 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-cyan-400 transition-all placeholder-transparent"
                        placeholder="Password">
                    <label class="absolute left-4 top-3 text-gray-500 text-sm transition-all peer-placeholder-shown:text-base peer-placeholder-shown:top-3 peer-focus:-top-6 peer-focus:text-cyan-400 peer-focus:text-xs">
                        Set Password
                    </label>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(8,145,178,0.4)] transition-all transform hover:-translate-y-1 mt-4">
                    ESTABLISH LINK
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-white/10">
                <p class="text-gray-500 text-sm">
                    Already linked? <a href="{{ url_for('auth.login') }}" class="text-cyan-400 hover:text-white transition font-bold">Login Here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
