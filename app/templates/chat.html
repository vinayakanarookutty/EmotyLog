{% extends "layout.html" %}

{% block content %}
<div class="h-[85vh] flex flex-col fade-in max-w-4xl mx-auto">
    
    <div class="glass px-6 py-4 rounded-t-2xl flex items-center justify-between border-b border-white/10">
        <div class="flex items-center gap-4">
            <div class="relative">
                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-purple-500/30">
                    <span class="text-xl">🤖</span>
                </div>
                <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-black rounded-full animate-pulse"></span>
            </div>
            <div>
                <h2 class="text-xl font-bold text-white tracking-wide">AI COUNSELOR</h2>
                <p class="text-xs text-purple-300">ONLINE • EMOTION DETECTION ACTIVE</p>
            </div>
        </div>
        <a href="{{ url_for('main.dashboard') }}" class="text-xs text-gray-400 hover:text-white border border-white/20 px-3 py-1 rounded hover:bg-white/10 transition">
            EXIT TERMINAL
        </a>
    </div>

    <div id="chatHistory" class="flex-1 glass border-x border-white/10 overflow-y-auto p-6 space-y-6 scrollbar-thin scrollbar-thumb-purple-600">
        
        <div class="flex gap-4">
            <div class="w-8 h-8 rounded-full bg-purple-600/50 flex-shrink-0 flex items-center justify-center text-xs">AI</div>
            <div class="bg-white/5 border border-white/10 rounded-2xl rounded-tl-none px-6 py-4 max-w-[80%]">
                <p class="text-gray-200">Hello. I have analyzed your recent entries. How are you feeling right now?</p>
            </div>
        </div>

    </div>

    <div class="glass p-4 rounded-b-2xl border-t border-white/10">
        <form onsubmit="event.preventDefault(); sendChatMessage();" class="flex gap-4 relative">
            <input type="text" id="messageInput" 
                class="flex-1 bg-black/40 border border-white/10 rounded-xl px-6 py-4 text-white focus:outline-none focus:border-purple-500 focus:bg-black/60 transition-all placeholder-gray-600"
                placeholder="Type your thoughts here..." autocomplete="off">
            
            <button type="submit" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white px-8 rounded-xl font-bold shadow-lg shadow-purple-900/40 transition transform hover:scale-105">
                SEND
            </button>
        </form>
    </div>

</div>

<script>
    const history = document.getElementById('chatHistory');
    const input = document.getElementById('messageInput');

    async function sendChatMessage() {
        const msg = input.value.trim();
        if (!msg) return;

        // 1. Add User Message to UI
        appendMessage('user', msg);
        input.value = '';
        scrollToBottom();

        // 2. Show Loading Indicator
        const loadingId = appendLoading();
        scrollToBottom();

        try {
            // 3. Send to Backend
            const res = await fetch('/chat_assistant', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: msg })
            });
            const data = await res.json();

            // 4. Remove Loading & Add AI Response
            document.getElementById(loadingId).remove();
            appendMessage('ai', data.reply);
            scrollToBottom();

        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage('ai', "Error: Neural link unstable. Please try again.");
        }
    }

    function appendMessage(sender, text) {
        const div = document.createElement('div');
        div.className = sender === 'user' ? 'flex gap-4 justify-end fade-in' : 'flex gap-4 fade-in';
        
        const bubbleColor = sender === 'user' 
            ? 'bg-purple-600 text-white rounded-tr-none shadow-[0_0_15px_rgba(147,51,234,0.3)]' 
            : 'bg-white/5 border border-white/10 rounded-tl-none text-gray-200';

        const avatar = sender === 'ai' 
            ? `<div class="w-8 h-8 rounded-full bg-purple-600/50 flex-shrink-0 flex items-center justify-center text-xs">AI</div>`
            : ``;

        div.innerHTML = `
            ${sender === 'ai' ? avatar : ''}
            <div class="${bubbleColor} rounded-2xl px-6 py-4 max-w-[80%] leading-relaxed">
                <p>${text}</p>
            </div>
        `;
        history.appendChild(div);
    }

    function appendLoading() {
        const id = 'loading-' + Date.now();
        const div = document.createElement('div');
        div.id = id;
        div.className = 'flex gap-4 fade-in';
        div.innerHTML = `
            <div class="w-8 h-8 rounded-full bg-purple-600/50 flex-shrink-0 flex items-center justify-center text-xs">AI</div>
            <div class="bg-white/5 border border-white/10 rounded-2xl rounded-tl-none px-6 py-4 flex items-center gap-2">
                <span class="w-2 h-2 bg-gray-500 rounded-full animate-bounce"></span>
                <span class="w-2 h-2 bg-gray-500 rounded-full animate-bounce delay-100"></span>
                <span class="w-2 h-2 bg-gray-500 rounded-full animate-bounce delay-200"></span>
            </div>
        `;
        history.appendChild(div);
        return id;
    }

    function scrollToBottom() {
        history.scrollTop = history.scrollHeight;
    }
</script>
{% endblock %}
